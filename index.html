<!doctype html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evan Speak | 地图式数字花园</title>
    <meta name="description" content="Evan Speak 是一个地图式数字花园：围绕产品、AI、商业、自我系统、观察五个主题，收纳长期思考与已经整理成篇的笔记。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="icon" href="assets/brand/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

  </head>
  <body>
    <main class="garden" aria-label="Evan Speak 地图式数字花园首页">
      <section class="map-pane" aria-label="主题地图">
        <header class="header">
          <a class="brand" href="./">
            <span class="brand-name">Evan Speak</span>
            <span class="brand-line">一张会生长的认知地图</span>
          </a>

          <nav class="nav" aria-label="主导航"><a href="notes/" class="nav-link">所有笔记</a></nav>
        </header>

        <div class="map" aria-label="思考地图">
          <div class="sea-mark sea-mark-a" aria-hidden="true">∿∿∿</div>
          <div class="sea-mark sea-mark-b" aria-hidden="true">∿∿∿</div>
          <div class="sea-mark sea-mark-c" aria-hidden="true">∿∿∿</div>

          <svg class="route-layer" viewBox="0 0 920 690" aria-hidden="true">
            <path class="route route-blue" d="M312 196 C392 190 435 174 500 180"></path>
            <path class="route route-blue" d="M672 295 C700 360 718 386 760 420"></path>
            <path class="route route-brown" d="M258 490 C328 502 362 508 428 500"></path>
            <circle class="joint" cx="312" cy="196" r="4"></circle>
            <circle class="joint" cx="500" cy="180" r="4"></circle>
            <circle class="joint" cx="672" cy="295" r="4"></circle>
            <circle class="joint" cx="760" cy="420" r="4"></circle>
            <circle class="joint warm" cx="258" cy="490" r="4"></circle>
            <circle class="joint warm" cx="428" cy="500" r="4"></circle>
          </svg>

          <button class="island product" type="button" data-topic="product">
            <img class="island-img" src="assets/islands/product.webp" alt="" aria-hidden="true">
            <span class="island-title">产品</span>
            <span class="island-question">什么产品值得<br>长期投入？</span>
          </button>

          <button class="island ai active" type="button" data-topic="ai">
            <img class="island-img" src="assets/islands/ai.webp" alt="" aria-hidden="true">
            <span class="island-title"><strong>AI</strong></span>
            <span class="island-question">智能的本质是什么，<br>与人类智能如何不同？</span>
          </button>

          <button class="island business" type="button" data-topic="business">
            <img class="island-img" src="assets/islands/business.webp" alt="" aria-hidden="true">
            <span class="island-title">商业</span>
            <span class="island-question">什么样的商业模式<br>能创造长期价值？</span>
          </button>

          <button class="island system" type="button" data-topic="system">
            <img class="island-img" src="assets/islands/system.webp" alt="" aria-hidden="true">
            <span class="island-title">自我系统</span>
            <span class="island-question">如何设计我的<br>生活与工作系统？</span>
          </button>

          <button class="island observe" type="button" data-topic="observe">
            <img class="island-img" src="assets/islands/observe.webp" alt="" aria-hidden="true">
            <span class="island-title">观察</span>
            <span class="island-question">世界正在发生<br>哪些重要变化？</span>
          </button>
        </div>

        <a class="continue" href="explore/">
          <span class="compass" aria-hidden="true"></span>
          <span>继续探索</span>
          <span class="continue-line" aria-hidden="true"></span>
        </a>
      </section>

      <aside class="detail" aria-label="当前主题详情">
        <div class="detail-inner">
          <div class="detail-title-row">
            <span id="topicDot" class="detail-dot"></span>
            <h1 id="topicTitle">AI</h1>
          </div>

          <p id="topicSummary">
            探索人工智能的本质、能力边界与演化路径，以及它如何影响我们的工作、学习与协作方式。保持开放与审慎，寻找可验证的认知与实践。
          </p>

          <section class="panel-notes" aria-label="该主题下的笔记">
            <div class="panel-notes-head">
              <span class="panel-notes-label">相关笔记</span>
              <span class="panel-notes-count" id="noteCount"></span>
            </div>
            <div class="panel-notes-box" id="notesBox">
              <div class="note-scroll" id="noteList"></div>
            </div>
          </section>

          <div class="sub-links">
            <a id="allNotesLink" href="topics/ai/notes/">全部笔记 →</a>
            <a id="pathLink" href="topics/ai/paths/">相关路径 →</a>
          </div>

          <div class="status">
            <span>内容状态</span>
            <strong id="topicStatus">
              <span class="sprout" aria-hidden="true"></span>
              萌芽
            </strong>
          </div>
        </div>
      </aside>
    </main>

    <script>
      const topics = {
        product: {
          title: "产品",
          summary:
            "观察产品如何回应真实需求，也记录哪些问题值得长期投入、哪些体验会形成复利。",
          status: "修订中",
          notesHref: "topics/product/notes/",
          pathsHref: "topics/product/paths/",
          notes: [
            { title: "agentNote 产品介绍：让知识成为所有 AI 的协作语言", hint: "工具介绍 · 成型", href: "topics/product/notes/agentnote-introduction/" },
            { title: "产品视觉协作提示词方法论：从产品主张到海报系列", hint: "AI 视觉 · 成型", href: "topics/product/notes/visual-collaboration-prompting/" },
            { title: "乙方 Agent 方法论：把事办漂亮，也让甲方心情好", hint: "协作方法 · 成型", href: "topics/product/notes/vendor-agent-methodology/" },
            { title: "agentNote 项目期望 · 大道至简三件事", hint: "设计取舍 · 成型", href: "topics/product/notes/agentnote-three-things/" },
            { title: "产品开发日志 · agentNote 迭代记录", hint: "开发日志 · 成型", href: "topics/product/notes/agentnote-devlog/" },
          ],
        },
        ai: {
          title: "AI",
          summary:
            "探索人工智能的本质、能力边界与演化路径，以及它如何影响我们的工作、学习与协作方式。保持开放与审慎，寻找可验证的认知与实践。",
          status: "萌芽",
          notesHref: "topics/ai/notes/",
          pathsHref: "topics/ai/paths/",
          notes: [
            { title: "Agent 时代，最好的协作平台可能早就存在：GitHub Issues", hint: "协作基础设施 · 成型", href: "topics/ai/notes/github-issues-agent-collaboration/" },
            { title: "一句 Siri，直接转接小开", hint: "语音交互 · 成型", href: "topics/ai/notes/siri-hands-free-chatgpt/" },
            { title: "AI 交互感觉认识方法论", hint: "认知方法 · 成型", href: "topics/ai/notes/sensation-to-cognition/" },
            { title: "好的提示词，不一定让 AI 更聪明", hint: "人机协作 · 成型", href: "topics/ai/notes/good-prompts-lower-friction/" },
            { title: "提示词生成方法论：少而定方向", hint: "提示词 · 成型", href: "topics/ai/notes/prompt-as-direction/" },
            { title: "带一个非常聪明、执行力很强，但工作经验非常低的实习生", hint: "协作方法 · 成型", href: "topics/ai/notes/managing-a-brilliant-rookie/" },

            { title: "把感觉翻译成现象", hint: "感受工程 · 待整理", href: "topics/ai/notes/feeling-to-phenomenon/" },


          ],
        },
        business: {
          title: "商业",
          summary:
            "记录商业模式、交易结构与长期价值的判断，理解什么样的系统能够稳定创造增量。",
          status: "萌芽",
          notesHref: "topics/business/notes/",
          pathsHref: "topics/business/paths/",
          notes: [
            { title: "小红书「有人感、分享味」写作方法论", hint: "内容写作 · 成型", href: "topics/business/notes/xiaohongshu-human-voice/" },
            { title: "小红书内容让人喜欢的方法论应用", hint: "内容分析 · 成型", href: "topics/business/notes/xiaohongshu-content-appeal/" },
            { title: "内容电商文章：写作方法论", hint: "内容写作 · 成型", href: "topics/business/notes/content-commerce-writing/" },
            { title: "内容电商：原始内容", hint: "内容素材 · 萌芽", href: "topics/business/notes/content-commerce-original/" },
          ],
        },
        system: {
          title: "自我系统",
          summary:
            "整理注意力、产出、复盘和生活秩序，让个人系统能支撑长期问题，而不是被短期状态牵着走。",
          status: "成型",
          notesHref: "topics/system/notes/",
          pathsHref: "topics/system/paths/",
          notes: [
            { title: "发展式阐述：为什么按因果链讲事情最清楚", hint: "结构化表达 · 成型", href: "topics/system/notes/developmental-explanation/" },
            { title: "把低摩擦交互迁移到文章与文档", hint: "写作方法 · 成型", href: "topics/system/notes/low-friction-to-writing/" },
            { title: "如何在 1 分钟内讲清“升维”", hint: "思考方法 · 成型", href: "topics/system/notes/explaining-level-up/" },
            { title: "公开构建会让笔记真正活起来", hint: "笔记方法 · 成型", href: "topics/system/notes/build-in-public-notes/" },
          ],
        },
        observe: {
          title: "观察",
          summary:
            "保留世界变化中的细微信号，把尚未成文的线索放在地图上，等待它们慢慢连接。",
          status: "萌芽",
          notesHref: "topics/observe/notes/",
          pathsHref: "topics/observe/paths/",
          notes: [
            { title: "一个热可颂和《当下的力量》", hint: "日常与情绪 · 成型", href: "topics/observe/notes/a-warm-croissant/" },
          ],
        },
      };

      const islands = document.querySelectorAll(".island");
      const title = document.querySelector("#topicTitle");
      const summary = document.querySelector("#topicSummary");
      const status = document.querySelector("#topicStatus");
      const dot = document.querySelector("#topicDot");
      const noteList = document.querySelector("#noteList");
      const notesBox = document.querySelector("#notesBox");
      const noteCount = document.querySelector("#noteCount");
      const allNotesLink = document.querySelector("#allNotesLink");
      const pathLink = document.querySelector("#pathLink");

      function updateScrollHint() {
        const canUp = noteList.scrollTop > 4;
        const canDown = noteList.scrollTop + noteList.clientHeight < noteList.scrollHeight - 4;
        notesBox.classList.toggle("can-up", canUp);
        notesBox.classList.toggle("can-down", canDown);
      }

      function renderNotes(notes) {
        noteCount.textContent = notes.length ? `${notes.length} 篇` : "";

        if (!notes.length) {
          noteList.innerHTML =
            '<div class="panel-empty">这个主题还没有整理完成的笔记。</div>';
          noteList.scrollTop = 0;
          updateScrollHint();
          return;
        }

        noteList.innerHTML = notes
          .map((note, index) => {
            const order = String(index + 1).padStart(2, "0");
            return `<a class="panel-note" href="${note.href}">
              <span class="panel-note-index">${order}</span>
              <span class="panel-note-body">
                <span class="panel-note-title">${note.title}</span>
                <span class="panel-note-hint">${note.hint}</span>
              </span>
            </a>`;
          })
          .join("");

        noteList.scrollTop = 0;
        updateScrollHint();
      }

      function showTopic(topicKey) {
        const topic = topics[topicKey];

        islands.forEach((item) => {
          item.classList.toggle("active", item.dataset.topic === topicKey);
        });

        title.textContent = topic.title;
        summary.textContent = topic.summary;
        status.innerHTML = `<span class="sprout" aria-hidden="true"></span>${topic.status}`;
        dot.className = `detail-dot ${topicKey}`;
        allNotesLink.href = topic.notesHref;
        pathLink.href = topic.pathsHref;
        renderNotes(topic.notes);
      }

      islands.forEach((island) => {
        island.addEventListener("click", () => showTopic(island.dataset.topic));
      });

      window.addEventListener("resize", updateScrollHint);
      noteList.addEventListener("scroll", updateScrollHint);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(updateScrollHint);
      }

      showTopic("ai");
    </script>

</body></html>
