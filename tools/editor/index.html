<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地网页工作台 · Evan Speak</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">E</span><div><strong>Evan Speak</strong><small>本地网页工作台</small></div></div>
      <div class="url-bar"><input id="urlInput" type="url" spellcheck="false" placeholder="粘贴本地网页 URL，例如 http://127.0.0.1:8898/site/topics/product/notes/agentnote-devlog/" aria-label="网页 URL" /><button id="openButton" type="button">打开网页</button></div>
    </header>
    <main>
      <div id="emptyState" class="empty-state"><span>✦</span><h1>打开要修改的网页</h1><p>把本地网页链接粘贴到上方，直接在完整页面中编辑。</p><p>也可以先打开 <a href="/site/" target="_blank">本地首页 ↗</a>，找到需要修改的页面并复制链接。</p></div>
      <section id="editorPanel" hidden>
        <div class="editor-bar">
          <div class="file-info"><strong id="filePath"></strong><span id="dirtyBadge" hidden>未更新</span></div>
          <div class="mode-switch"><button id="visualButton" class="selected" type="button">页面编辑</button><button id="sourceButton" type="button">HTML 源码</button></div>
          <div id="formatTools" class="format-tools"><button id="boldButton" type="button" title="加粗"><strong>B</strong></button><button id="italicButton" type="button" title="斜体"><em>I</em></button><button id="linkButton" type="button">链接</button><button id="imageButton" type="button">插入图片</button><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden /></div>
        </div>
        <iframe id="pageFrame" title="正在编辑的完整网页" sandbox="allow-same-origin"></iframe>
        <textarea id="sourceEditor" spellcheck="false" aria-label="完整 HTML 源码" hidden></textarea>
        <footer class="actionbar"><div id="message" role="status">点击页面中的文字即可编辑。</div><div class="actions"><button id="updateButton" type="button">更新 HTML</button><button id="publishButton" type="button">推送到线上</button></div></footer>
      </section>
    </main>
    <dialog id="publishDialog"><h2>确认推送的站点文件</h2><p>以下本地变更会提交并推送到 main。</p><pre id="changeList"></pre><div class="dialog-actions"><button id="cancelPublish" type="button">返回检查</button><button id="confirmPublish" type="button">确认推送</button></div></dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
